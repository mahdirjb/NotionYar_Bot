apply plugin: "com.android.application"

def webAppUrl = project.findProperty("webAppUrl") ?: "https://notionyar.rjbzmhd.ir/"

android {
    namespace "ir.rjbzmhd.notionyar"
    compileSdk 35

    defaultConfig {
        applicationId "ir.rjbzmhd.notionyar"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "WEBAPP_URL", "\"${webAppUrl.replace('\\', '\\\\').replace('"', '\\"')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}
